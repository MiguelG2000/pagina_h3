{% load static %}
<section id="hero" class="relative w-full min-h-screen flex items-center justify-center overflow-hidden py-20">
    <!-- Carrusel de imágenes de fondo con Overlay -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <!-- Imágenes del carrusel -->
        <img src="{% static 'images/hero.jpeg' %}" alt="Estructura Metálica 1" class="hero-slide absolute inset-0 w-full h-full object-cover object-center transition-opacity duration-1000 ease-in-out opacity-100" />
        <img src="{% static 'images/hero2.jpg' %}" alt="Estructura Metálica 2" class="hero-slide absolute inset-0 w-full h-full object-cover object-center transition-opacity duration-1000 ease-in-out opacity-0" />
        <img src="{% static 'images/hero3.jpg' %}" alt="Estructura Metálica 3" class="hero-slide absolute inset-0 w-full h-full object-cover object-center transition-opacity duration-1000 ease-in-out opacity-0" />
        
        <!-- Overlay -->
        <div class="absolute inset-0 bg-black/70 dark:bg-black/80"></div>
    </div>

    <!-- Contenido -->
    <div class="relative z-10 text-center px-4 sm:px-6 max-w-4xl mx-auto" data-aos="zoom-in" data-aos-duration="1000">
        <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-black text-white mb-4 sm:mb-6 tracking-tight">
            LÍDERES DE LA <span class="text-brand-red">CONSTRUCCIÓN</span>
        </h1>
        <h2 class="text-lg sm:text-2xl md:text-3xl text-gray-200 mb-4 sm:mb-8 font-light">
            Soluciones integrales en montajes y estructuras metálicas
        </h2>
        <p class="text-sm sm:text-lg text-gray-300 mb-6 sm:mb-10 max-w-2xl mx-auto px-2">
            Desarrollamos proyectos de infraestructura pública y privada, cumpliendo con los más altos estándares de calidad.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <a href="#portafolio" class="inline-block bg-brand-red hover:bg-brand-darkred text-white font-bold py-3 sm:py-4 px-8 sm:px-10 rounded-full transition-all transform hover:scale-105 shadow-[0_0_20px_rgba(230,0,0,0.4)] text-sm sm:text-base w-full sm:w-auto text-center">
                <i class="fas fa-briefcase mr-2"></i>Ver Nuestro Trabajo
            </a>
            <a href="#contacto" class="inline-block bg-transparent border-2 border-white hover:border-brand-red hover:bg-brand-red text-white font-bold py-3 sm:py-4 px-8 sm:px-10 rounded-full transition-all transform hover:scale-105 text-sm sm:text-base w-full sm:w-auto text-center">
                <i class="fas fa-envelope mr-2"></i>Contactar
            </a>
        </div>
    </div>
</section>

<!-- Script para la transición automática del carrusel -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const slides = document.querySelectorAll('.hero-slide');
        let currentSlide = 0;
        const intervalTime = 5000; // Tiempo en milisegundos entre cada cambio (5 segundos)

        function nextSlide() {
            // Oculta la imagen actual
            slides[currentSlide].classList.remove('opacity-100');
            slides[currentSlide].classList.add('opacity-0');

            // Calcula el índice de la siguiente imagen
            currentSlide = (currentSlide + 1) % slides.length;

            // Muestra la siguiente imagen
            slides[currentSlide].classList.remove('opacity-0');
            slides[currentSlide].classList.add('opacity-100');
        }

        // Inicia el intervalo
        setInterval(nextSlide, intervalTime);
    });
</script>
