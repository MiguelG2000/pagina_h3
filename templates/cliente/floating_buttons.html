<!-- Botones Flotantes (Globales) -->
<div class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50 flex flex-col gap-3 sm:gap-4">
    <!-- Botón WhatsApp -->
    <a href="https://wa.me/529612121795" target="_blank" 
       class="group relative w-12 h-12 sm:w-14 sm:h-14 lg:w-16 lg:h-16 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center shadow-lg hover:shadow-2xl hover:scale-110 active:scale-95 transition-all duration-300" 
       aria-label="Contactar por WhatsApp">
        <i class="fab fa-whatsapp text-2xl sm:text-3xl lg:text-4xl text-white"></i>
        <!-- Tooltip -->
        <span class="absolute right-full mr-3 px-3 py-2 bg-gray-900 text-white text-xs sm:text-sm rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap pointer-events-none">
            WhatsApp
            <span class="absolute left-full top-1/2 -translate-y-1/2 border-8 border-transparent border-l-gray-900"></span>
        </span>
        <!-- Indicador de notificación -->
        <span class="absolute -top-1 -right-1 w-3 h-3 sm:w-4 sm:h-4 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>
    </a>
    
    <!-- Botón Llamada -->
    <a href="tel:+529612121795" 
       class="group relative w-12 h-12 sm:w-14 sm:h-14 lg:w-16 lg:h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full flex items-center justify-center shadow-lg hover:shadow-2xl hover:scale-110 active:scale-95 transition-all duration-300" 
       aria-label="Llamar por teléfono">
        <i class="fas fa-phone text-xl sm:text-2xl lg:text-3xl text-white"></i>
        <!-- Tooltip -->
        <span class="absolute right-full mr-3 px-3 py-2 bg-gray-900 text-white text-xs sm:text-sm rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap pointer-events-none">
            Llamar ahora
            <span class="absolute left-full top-1/2 -translate-y-1/2 border-8 border-transparent border-l-gray-900"></span>
        </span>
    </a>
    
    <!-- Botón Email -->
    <a href="mailto:h3construccionescontemporaneas@gmail.com" 
       class="group relative w-12 h-12 sm:w-14 sm:h-14 lg:w-16 lg:h-16 bg-gradient-to-br from-brand-red to-brand-darkred rounded-full flex items-center justify-center shadow-lg hover:shadow-2xl hover:scale-110 active:scale-95 transition-all duration-300" 
       aria-label="Enviar correo electrónico">
        <i class="fas fa-envelope text-xl sm:text-2xl lg:text-3xl text-white"></i>
        <!-- Tooltip -->
        <span class="absolute right-full mr-3 px-3 py-2 bg-gray-900 text-white text-xs sm:text-sm rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap pointer-events-none">
            Enviar email
            <span class="absolute left-full top-1/2 -translate-y-1/2 border-8 border-transparent border-l-gray-900"></span>
        </span>
    </a>
    
    <!-- Botón Volver Arriba -->
    <button onclick="scrollToTop()" 
            class="group relative w-12 h-12 sm:w-14 sm:h-14 lg:w-16 lg:h-16 bg-gradient-to-br from-gray-600 to-gray-800 rounded-full flex items-center justify-center shadow-lg hover:shadow-2xl hover:scale-110 active:scale-95 transition-all duration-300 hidden" 
            id="scrollTopBtn" 
            aria-label="Volver arriba">
        <i class="fas fa-chevron-up text-xl sm:text-2xl lg:text-3xl text-white"></i>
        <!-- Tooltip -->
        <span class="absolute right-full mr-3 px-3 py-2 bg-gray-900 text-white text-xs sm:text-sm rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap pointer-events-none">
            Volver arriba
            <span class="absolute left-full top-1/2 -translate-y-1/2 border-8 border-transparent border-l-gray-900"></span>
        </span>
    </button>
</div>

<script>
    // Función para volver arriba
    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }
    
    // Mostrar/ocultar botón "Volver arriba" según scroll
    window.addEventListener('scroll', function() {
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        if (window.scrollY > 300) {
            scrollTopBtn.classList.remove('hidden');
            scrollTopBtn.classList.add('flex');
        } else {
            scrollTopBtn.classList.add('hidden');
            scrollTopBtn.classList.remove('flex');
        }
    });
</script>
