{% load static %}
<section id="contacto" class="py-16 sm:py-20 lg:py-24 bg-gray-100 dark:bg-gray-900 bg-cover transition-colors duration-500">
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div class="text-center mb-12 sm:mb-16" data-aos="fade-down">
            <h2 class="text-3xl sm:text-5xl font-black text-brand-black dark:text-white">Contacto</h2>
            <div class="w-24 h-1 bg-brand-red mx-auto mt-4 mb-6"></div>
            <p class="text-sm sm:text-lg text-gray-600 dark:text-gray-300">Estamos listos para atenderte y asesorarte en tu próximo proyecto</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
            
            <!-- Columna Izquierda: Datos y Mapa Interactivo -->
            <div class="bg-white dark:bg-brand-black/50 p-6 sm:p-8 lg:p-12 rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-800" data-aos="fade-right">
                <ul class="space-y-4 sm:space-y-6 mb-8 sm:mb-10 text-gray-700 dark:text-gray-200 text-sm sm:text-base">
                    <li class="flex items-start gap-4">
                        <span class="text-brand-red text-xl sm:text-2xl"><i class="fas fa-map-marker-alt"></i></span>
                        <span class="flex-1">Carretera Tuxtla-San Fernando km 8.5, Tuxtla Gutiérrez, Chis., C.P. 29129</span>
                    </li>
                    <li class="flex items-center gap-4">
                        <span class="text-brand-red text-xl sm:text-2xl"><i class="fas fa-phone"></i></span>
                        <span>961 212 1795</span>
                    </li>
                    <li class="flex items-start gap-4">
                        <span class="text-brand-red text-xl sm:text-2xl"><i class="fas fa-envelope"></i></span>
                        <span class="flex-1 break-all">h3construccionescontemporaneas@gmail.com</span>
                    </li>
                </ul>

                <!-- Redes y Descargas -->
                <div class="flex gap-4 mb-8 sm:mb-10 border-t border-gray-200 dark:border-gray-800 pt-6 sm:pt-8">
                    <a href="https://www.facebook.com/h3construccionescontemporaneas" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center bg-brand-red text-white rounded-full hover:bg-brand-darkred transition-colors">
                        <i class="fab fa-facebook-f text-lg sm:text-xl"></i>
                    </a>
                </div>
                <div class="space-y-4">
                    <a href="{% static 'pdf/portafolio.pdf' %}" class="flex items-center gap-3 text-brand-red hover:text-brand-darkred font-semibold transition-colors text-sm sm:text-base">
                        <i class="fas fa-download"></i> Descargar Portafolio de Obras
                    </a>
                </div>
                
                <!-- Mapa Interactivo con Google Maps -->
                <div class="mt-6 sm:mt-8 h-52 sm:h-64 w-full bg-gray-200 dark:bg-gray-800 rounded-2xl overflow-hidden shadow-inner border border-gray-300 dark:border-gray-700">
                    <iframe 
                        title="Ubicación de H3 Construcciones Contemporáneas"
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3819.570776739665!2d-93.1678121!3d16.8003183!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85ecd73072c67921%3A0xcfe60934ad77dfdb!2sH3%20CONSTRUCCIONES%20CONTEMPORANEAS%20S.A.%20DE%20C.V.!5e0!3m2!1ses!2smx!4v1700000000000!5m2!1ses!2smx" 
                        class="w-full h-full border-0" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>

            <!-- Columna Derecha: Formulario a WhatsApp -->
            <div class="bg-white dark:bg-brand-black/50 p-6 sm:p-8 lg:p-12 rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-800" data-aos="fade-left">
                <form id="waForm" onsubmit="sendToWhatsApp(event)" class="space-y-4 sm:space-y-6">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">
                            <i class="fas fa-user mr-2 text-brand-red"></i>Nombre completo
                        </label>
                        <input type="text" id="waName" placeholder="Escribe tu nombre" required 
                               class="w-full bg-gray-50 dark:bg-brand-gray border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-gray-900 dark:text-white focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red transition-colors text-sm sm:text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">
                            <i class="fas fa-phone mr-2 text-brand-red"></i>Teléfono
                        </label>
                        <input type="tel" id="waPhone" placeholder="Escribe tu teléfono" required 
                               class="w-full bg-gray-50 dark:bg-brand-gray border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-gray-900 dark:text-white focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red transition-colors text-sm sm:text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">
                            <i class="fas fa-comment mr-2 text-brand-red"></i>Mensaje
                        </label>
                        <textarea id="waMessage" placeholder="Escribe tu mensaje" rows="4" required 
                                  class="w-full bg-gray-50 dark:bg-brand-gray border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-gray-900 dark:text-white focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red transition-colors text-sm sm:text-base resize-vertical"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-brand-red hover:bg-brand-darkred text-white font-bold py-3 sm:py-4 rounded-lg transition-colors text-sm sm:text-base">
                        <i class="fab fa-whatsapp mr-2"></i>Enviar Mensaje por WhatsApp
                    </button>
                </form>
            </div>
            
        </div>
    </div>
</section>

<script>
    function sendToWhatsApp(e) {
        e.preventDefault();
        const numTelefono = "529612121795"; // Número de H3
        const nombre = document.getElementById("waName").value;
        const telefono = document.getElementById("waPhone").value;
        const mensaje = document.getElementById("waMessage").value;
        
        const texto = `Hola, mi nombre es ${nombre}. Mi número es ${telefono}.%0A%0AMensaje: ${mensaje}`;
        const url = `https://wa.me/${numTelefono}?text=${texto}`;
        
        window.open(url, '_blank');
    }
</script>
