<script>
    function sendToWhatsApp(e) {
        e.preventDefault();
        const numTelefono = "529612121795"; // Número de H3
        const nombre = document.getElementById("waName").value;
        const telefono = document.getElementById("waPhone").value;
        const mensaje = document.getElementById("waMessage").value;
        
        const texto = `Hola, mi nombre es ${nombre}. Mi número es ${telefono}.%0A%0AMensaje: ${mensaje}`;
        const url = `https://wa.me/${numTelefono}?text=${texto}`;
        
        window.open(url, '_blank');
    }
</script>
