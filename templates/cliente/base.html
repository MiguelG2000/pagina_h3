<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H3 Construcciones Contemporáneas</title>
    
    <!-- Tailwind CSS (CDN para desarrollo) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Configuración de Tailwind para paleta corporativa y Modo Oscuro -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#E60000', // Rojo corporativo
                            darkred: '#B30000',
                            black: '#0A0A0A',
                            gray: '#171717'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-brand-black dark:text-white transition-colors duration-500 font-sans antialiased relative">

    {% include 'cliente/header.html' %}
    {% include 'cliente/hero.html' %}
    {% include 'cliente/nosotros.html' %}
    {% include 'cliente/valores.html' %}
    {% include 'cliente/servicios.html' %}
    {% include 'cliente/portafolio.html' %}
    {% include 'cliente/contacto.html' %}
    {% include 'cliente/footer.html' %}

    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <!-- Scripts Funcionales -->
    <script>
        // Inicializar animaciones de scroll
        AOS.init({
            once: false,
            mirror: true,
            duration: 800,
            offset: 100,
        });

        // Lógica de Modo Claro / Oscuro
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        // Verifica la preferencia del sistema o si ya se guardó una
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        function toggleTheme() {
            htmlElement.classList.toggle('dark');
            if (htmlElement.classList.contains('dark')) {
                localStorage.theme = 'dark';
            } else {
                localStorage.theme = 'light';
            }
        }

        // Lógica Menú Móvil
        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }
    </script>
</body>
</html>
