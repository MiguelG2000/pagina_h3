{% load static %}

<header class="fixed top-0 w-full z-50 bg-gray-100/95 dark:bg-zinc-800/95 backdrop-blur-md border-b border-gray-300/70 dark:border-zinc-700/70 transition-colors duration-500">
    <div class="w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
        <div class="relative flex items-center justify-between h-16 sm:h-20 lg:h-24 xl:h-28">

            <!-- ================= NAV IZQUIERDA (Desktop) ================= -->
            <nav class="hidden lg:flex items-center gap-4 xl:gap-6 z-10">
                <a href="#hero" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Inicio</a>
                <a href="#nosotros" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Nosotros</a>

                <!-- Desplegable: Nuestros Servicios -->
                <div class="relative group">
                    <button class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base flex items-center gap-1 py-2">
                        <span>Nuestros Servicios</span>
                        <i class="fas fa-chevron-down text-xs transition-transform duration-300 group-hover:rotate-180"></i>
                    </button>
                    <div class="absolute top-full left-0 w-56 bg-gray-50 dark:bg-zinc-800 shadow-xl rounded-xl border border-gray-200 dark:border-zinc-700 py-2 hidden group-hover:block transition-all opacity-0 group-hover:opacity-100 transform translate-y-2 group-hover:translate-y-0">
                        <a href="#servicios" class="block px-4 py-2.5 text-sm font-medium hover:bg-brand-red hover:text-white transition-colors flex items-center gap-2">
                            <i class="fas fa-crane text-brand-red group-hover:text-white w-5"></i> Grúas
                        </a>
                        <a href="#servicios" class="block px-4 py-2.5 text-sm font-medium hover:bg-brand-red hover:text-white transition-colors flex items-center gap-2">
                            <i class="fas fa-cubes text-brand-red group-hover:text-white w-5"></i> Estructuras
                        </a>
                        <a href="#servicios" class="block px-4 py-2.5 text-sm font-medium hover:bg-brand-red hover:text-white transition-colors flex items-center gap-2">
                            <i class="fas fa-project-diagram text-brand-red group-hover:text-white w-5"></i> Proyectos
                        </a>
                        <a href="#servicios" class="block px-4 py-2.5 text-sm font-medium hover:bg-brand-red hover:text-white transition-colors flex items-center gap-2">
                            <i class="fas fa-truck text-brand-red group-hover:text-white w-5"></i> Logística
                        </a>
                    </div>
                </div>
            </nav>

            <!-- ================= LOGO CENTRADO ================= -->
            <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 flex items-center justify-center pointer-events-none">
                <a href="#hero" aria-label="Inicio"
                   class="group inline-flex items-center pointer-events-auto transition-transform duration-300">
                    <img src="{% static 'images/logo.png' %}"
                         alt="Logo Constructora H3"
                         class="h-14 sm:h-18 lg:h-22 xl:h-24
                                w-auto
                                max-w-[260px] sm:max-w-[320px] lg:max-w-[300px] xl:max-w-[380px] 2xl:max-w-[440px]
                                object-contain
                                dark:!filter-none
                                transition-transform duration-300
                                group-hover:scale-105">
                </a>
            </div>

            <!-- ================= NAV DERECHA + BOTONES ================= -->
            <div class="flex items-center gap-4 xl:gap-6 ml-auto z-10">
                <nav class="hidden lg:flex items-center gap-4 xl:gap-6">
                    <a href="#equipo-carga" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Equipo de Carga</a>
                    <a href="#portafolio" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Portafolio</a>
                    <a href="#contacto" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Contacto</a>

                    <!-- Botón Tema (Desktop) -->
                    <button onclick="toggleTheme()" id="theme-toggle"
                            class="p-2 rounded-full bg-gray-200 dark:bg-zinc-700 text-gray-800 dark:text-white hover:bg-brand-red hover:text-white transition-all"
                            aria-label="Cambiar tema">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:inline"></i>
                    </button>
                </nav>

                <!-- Botones móvil -->
                <div class="lg:hidden flex items-center gap-2 sm:gap-3">
                    <button onclick="toggleTheme()" class="p-2 rounded-full bg-gray-200 dark:bg-zinc-700" aria-label="Cambiar tema">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:inline"></i>
                    </button>
                    <button onclick="toggleMenu()" class="text-brand-red focus:outline-none p-2" aria-label="Menú">
                        <i id="menu-icon" class="fas fa-bars text-2xl sm:text-3xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= MENÚ MÓVIL ================= -->
    <div id="mobile-menu" class="hidden lg:hidden bg-gray-50 dark:bg-zinc-800 border-t border-gray-200 dark:border-zinc-700 shadow-2xl max-h-[85vh] overflow-y-auto">
        <a href="#hero" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold">
            <i class="fas fa-home mr-3"></i>Inicio
        </a>
        <a href="#nosotros" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold">
            <i class="fas fa-users mr-3"></i>Nosotros
        </a>

        <div class="px-6 py-2 border-y border-gray-200 dark:border-zinc-700 bg-gray-100/60 dark:bg-zinc-700/40">
            <span class="text-xs font-bold uppercase tracking-wider text-brand-red">Nuestros Servicios</span>
            <div class="mt-2 space-y-1 pl-4">
                <a href="#servicios" class="block py-2 text-sm font-semibold hover:text-brand-red"><i class="fas fa-crane w-5 text-brand-red"></i> Grúas</a>
                <a href="#servicios" class="block py-2 text-sm font-semibold hover:text-brand-red"><i class="fas fa-cubes w-5 text-brand-red"></i> Estructuras</a>
                <a href="#servicios" class="block py-2 text-sm font-semibold hover:text-brand-red"><i class="fas fa-project-diagram w-5 text-brand-red"></i> Proyectos</a>
                <a href="#servicios" class="block py-2 text-sm font-semibold hover:text-brand-red"><i class="fas fa-truck w-5 text-brand-red"></i> Logística</a>
            </div>
        </div>

        <a href="#equipo-carga" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold text-brand-red">
            <i class="fas fa-truck-monster mr-3"></i>Equipo de Carga
        </a>
        <a href="#portafolio" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold">
            <i class="fas fa-folder-open mr-3"></i>Portafolio
        </a>
        <a href="#contacto" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold">
            <i class="fas fa-envelope mr-3"></i>Contacto
        </a>
    </div>
</header>
