{% load static %}

<header class="fixed top-0 w-full z-50 bg-gray-100/95 dark:bg-zinc-800/95 backdrop-blur-md border-b border-gray-300/70 dark:border-zinc-700/70 transition-colors duration-500">
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="relative flex items-center justify-between h-16 sm:h-20 lg:h-24">

            <!-- ================= NAV IZQUIERDA (Desktop) ================= -->
            <nav class="hidden lg:flex items-center gap-6 z-10 text-gray-800 dark:text-gray-100">
                <a href="#hero" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Inicio</a>
                <a href="#nosotros" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Nosotros</a>

                <!-- Desplegable: Nuestros Servicios -->
                <div class="relative group">
                    <button class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base flex items-center gap-1.5 py-2 focus:outline-none">
                        <span>Nuestros Servicios</span>
                        <i class="fas fa-chevron-down text-xs transition-transform duration-300 group-hover:rotate-180"></i>
                    </button>
                    <div class="absolute top-full left-0 w-56 bg-white dark:bg-zinc-800 shadow-xl rounded-xl border border-gray-200 dark:border-zinc-700 py-2 hidden group-hover:block transition-all duration-200 opacity-0 group-hover:opacity-100 transform translate-y-2 group-hover:translate-y-0">
                        <a href="#servicios" class="px-4 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-brand-red hover:text-white transition-colors flex items-center gap-3 group/item">
                            <i class="fas fa-crane text-brand-red group-hover/item:text-white w-5 transition-colors"></i> Grúas
                        </a>
                        <a href="#servicios" class="px-4 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-brand-red hover:text-white transition-colors flex items-center gap-3 group/item">
                            <i class="fas fa-cubes text-brand-red group-hover/item:text-white w-5 transition-colors"></i> Estructuras
                        </a>
                        <a href="#servicios" class="px-4 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-brand-red hover:text-white transition-colors flex items-center gap-3 group/item">
                            <i class="fas fa-project-diagram text-brand-red group-hover/item:text-white w-5 transition-colors"></i> Proyectos
                        </a>
                        <a href="#servicios" class="px-4 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-brand-red hover:text-white transition-colors flex items-center gap-3 group/item">
                            <i class="fas fa-truck text-brand-red group-hover/item:text-white w-5 transition-colors"></i> Logística
                        </a>
                    </div>
                </div>
            </nav>

            <!-- ================= LOGO TIPO TEXTO (CENTRADO) ================= -->
            <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20">
                <a href="#hero" aria-label="Inicio - Grupo H3" class="group flex items-center gap-1 select-none">
                    <span class="text-2xl sm:text-3xl lg:text-4xl font-black tracking-tight text-gray-900 dark:text-white transition-colors uppercase">
                        Grupo <span class="text-brand-red group-hover:drop-shadow-[0_0_12px_rgba(220,38,38,0.5)] transition-all">H3</span>
                    </span>
                </a>
            </div>

            <!-- ================= NAV DERECHA + BOTONES ================= -->
            <div class="flex items-center gap-4 xl:gap-6 ml-auto z-10">
                <nav class="hidden lg:flex items-center gap-6 text-gray-800 dark:text-gray-100">
                    <a href="#equipo-carga" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Equipo de Carga</a>
                    <a href="#portafolio" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Portafolio</a>
                    <a href="#contacto" class="hover:text-brand-red font-semibold transition-colors text-sm xl:text-base">Contacto</a>

                    <!-- Botón Tema (Desktop) -->
                    <button onclick="toggleTheme()" class="p-2.5 rounded-full bg-gray-200/80 dark:bg-zinc-700/80 text-gray-800 dark:text-white hover:bg-brand-red hover:text-white dark:hover:bg-brand-red transition-all focus:outline-none" aria-label="Cambiar tema">
                        <i class="fas fa-moon dark:hidden text-sm"></i>
                        <i class="fas fa-sun hidden dark:inline text-sm"></i>
                    </button>
                </nav>

                <!-- Botones móvil -->
                <div class="lg:hidden flex items-center gap-2">
                    <button onclick="toggleTheme()" class="p-2 rounded-full bg-gray-200 dark:bg-zinc-700 text-gray-800 dark:text-white focus:outline-none" aria-label="Cambiar tema">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:inline"></i>
                    </button>
                    <button onclick="toggleMenu()" class="text-brand-red focus:outline-none p-2 rounded-lg hover:bg-gray-200/50 dark:hover:bg-zinc-700/50 transition-colors" aria-label="Menú">
                        <i id="menu-icon" class="fas fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= MENÚ MÓVIL ================= -->
    <div id="mobile-menu" class="hidden lg:hidden bg-white dark:bg-zinc-800 border-t border-gray-200 dark:border-zinc-700 shadow-2xl max-h-[calc(100vh-4rem)] overflow-y-auto text-gray-800 dark:text-gray-100">
        <a href="#hero" onclick="closeMenu()" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold">
            <i class="fas fa-home w-6"></i>Inicio
        </a>
        <a href="#nosotros" onclick="closeMenu()" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold">
            <i class="fas fa-users w-6"></i>Nosotros
        </a>

        <!-- Acordeón Servicios Móvil -->
        <div class="border-y border-gray-200 dark:border-zinc-700 bg-gray-50 dark:bg-zinc-800/50">
            <button onclick="toggleMobileServices()" class="w-full px-6 py-3.5 flex items-center justify-between font-semibold text-brand-red focus:outline-none">
                <span class="flex items-center"><i class="fas fa-concierge-bell w-6"></i>Nuestros Servicios</span>
                <i id="services-icon" class="fas fa-chevron-down text-xs transition-transform duration-300"></i>
            </button>
            <div id="mobile-services-menu" class="hidden pl-6 space-y-1 pb-3">
                <a href="#servicios" onclick="closeMenu()" class="block py-2 px-4 text-sm font-medium hover:text-brand-red"><i class="fas fa-crane w-6 text-brand-red"></i> Grúas</a>
                <a href="#servicios" onclick="closeMenu()" class="block py-2 px-4 text-sm font-medium hover:text-brand-red"><i class="fas fa-cubes w-6 text-brand-red"></i> Estructuras</a>
                <a href="#servicios" onclick="closeMenu()" class="block py-2 px-4 text-sm font-medium hover:text-brand-red"><i class="fas fa-project-diagram w-6 text-brand-red"></i> Proyectos</a>
                <a href="#servicios" onclick="closeMenu()" class="block py-2 px-4 text-sm font-medium hover:text-brand-red"><i class="fas fa-truck w-6 text-brand-red"></i> Logística</a>
            </div>
        </div>

        <a href="#equipo-carga" onclick="closeMenu()" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold">
            <i class="fas fa-truck-monster w-6"></i>Equipo de Carga
        </a>
        <a href="#portafolio" onclick="closeMenu()" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold">
            <i class="fas fa-folder-open w-6"></i>Portafolio
        </a>
        <a href="#contacto" onclick="closeMenu()" class="block px-6 py-3.5 hover:bg-brand-red hover:text-white transition-colors font-semibold">
            <i class="fas fa-envelope w-6"></i>Contacto
        </a>
    </div>
</header>

<script>
    function toggleMenu() {
        const menu = document.getElementById('mobile-menu');
        const icon = document.getElementById('menu-icon');
        
        menu.classList.toggle('hidden');
        
        if (menu.classList.contains('hidden')) {
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        } else {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-times');
        }
    }

    function closeMenu() {
        const menu = document.getElementById('mobile-menu');
        const icon = document.getElementById('menu-icon');
        if (!menu.classList.contains('hidden')) {
            menu.classList.add('hidden');
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        }
    }

    function toggleMobileServices() {
        const servicesMenu = document.getElementById('mobile-services-menu');
        const icon = document.getElementById('services-icon');
        
        servicesMenu.classList.toggle('hidden');
        icon.classList.toggle('rotate-180');
    }

    function toggleTheme() {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
    }
</script>
